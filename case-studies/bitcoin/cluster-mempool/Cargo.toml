[package]
name = "ephyra-bitcoin-cluster-mempool"
version = "0.0.0"
edition = "2021"
publish = false
description = "Ephyra property-based tests for Bitcoin Core Cluster Mempool (TxGraph, cluster_linearize, CTxMemPool, RBF, TRUC, Ephemeral Dust, BlockAssembler, MiniMiner)"

[features]
default = []
# Enable in-process C++ LLVM coverage reading over TxGraph & cluster_linearize.
cpp-cov = ["ephyra/coverage", "ephyra/coverage-force"]

[dependencies]
ephyra = { path = "../../../crates/ephyra" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
bitcoin = "0.32"

[build-dependencies]
cc = "1"

[profile.release]
debug-assertions = true
overflow-checks = true

[workspace]
